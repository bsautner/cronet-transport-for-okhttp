name: Android Library Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Android SDK components
      run: |
        yes | sdkmanager "platform-tools" "platforms;android-32" "build-tools;30.0.2" "ndk;21.4.7075529" || if [ $? -eq 141 ]; then true; else exit $?; fi
        yes | sdkmanager --licenses || if [ $? -eq 141 ]; then true; else exit $?; fi
      shell: bash
    
    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@0.8.5
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true
    
    - name: Configure Android environment
      run: |
        echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV
      shell: bash
    
    - name: Build Android library
      run: |
        bazel build //:okhttp_cronet_transport
      shell: bash
    
    - name: List build artifacts
      run: |
        echo "=== Build artifacts in bazel-bin/ ==="
        find bazel-bin/ -type f \( -name "*.aar" -o -name "*.jar" \) -ls || true
        echo ""
        echo "=== Main library target location ==="
        ls -lh bazel-bin/libokhttp_cronet_transport.jar 2>/dev/null || echo "Main JAR not found at expected location"
        ls -lh bazel-bin/okhttp_cronet_transport.aar 2>/dev/null || echo "Main AAR not found at expected location"
      shell: bash
    
    - name: Run tests
      run: |
        bazel test //javatests/...
      continue-on-error: true
      shell: bash
    
    - name: Archive library artifacts
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: library-artifacts
        path: |
          bazel-bin/**/*.aar
          bazel-bin/**/*.jar
          bazel-bin/**/okhttp_cronet_transport*
        retention-days: 30
        if-no-files-found: warn
    
    - name: Archive test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          bazel-testlogs/
        retention-days: 7
        if-no-files-found: ignore
